<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ann Gaming - Tienda Gamer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!--------------------------- ENCABEZADO PRINCIPAL ---------------------------------------->
    <header>
        <nav class="navbar navbar-dark bg-black py-3">
            <div class="container text-center text-md-start">
                <a class="navbar-brand text-white fw-bold fs-3" href="#">ANN GAMING</a>
            </div>
        </nav>
    </header>
<!--------------------------- CUADRO DE BUSQUEDA USANDO bootstrap ---------------------------------------->
    <section class="banner-principal py-5 text-white text-center">
        <div class="container">
            <h1 class="display-4 fw-bold mb-4">Catálogo de Productos</h1>
            <div class="row justify-content-center">
                <div class="col-12 col-md-6">
                    <form class="d-flex" role="search" onsubmit="event.preventDefault();">
                        <input 
                            id="buscador" 
                            class="form-control me-2 buscador-input" 
                            type="search" 
                            placeholder="Buscar producto..." 
                            aria-label="Search"
                        >
                        <button class="btn btn-outline-light" type="submit">Buscar</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

<!-------------------------- CAJAS CONTENEDORAS DE PRODUCTOS ---------------------------------------------->
    <main class="container my-5">
        <div id="contenedor_productos" class="row g-4"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> -- vinculo bootstrap
    
    <script src="assets/js/script.js"></script>
</body>
</html>
